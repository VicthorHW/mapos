server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 64M;

    # Cabeçalhos básicos de segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # Bloqueia arquivos ocultos (.git, .env etc.)
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Diretórios internos da aplicação nunca devem ser acessados via HTTP
    location ^~ /application/ {
        deny all;
    }

    location ^~ /docker/ {
        deny all;
    }

    location ^~ /docs/ {
        deny all;
    }

    location ^~ /updates/ {
        deny all;
    }

    # Banco SQL usado pelo instalador deve existir no disco,
    # mas nunca deve ser baixável pela internet.
    location = /banco.sql {
        deny all;
    }

    # Outros arquivos internos
    location = /composer.json {
        deny all;
    }

    location = /composer.lock {
        deny all;
    }

    # Impede execução de  enviado para pasta de assets/uploads
    location ~* ^/assets/.*\.php$ {
        deny all;
    }

    # Bloqueia extensões sensíveis
    location ~* \.(sql|env|ini|log|ya?ml|conf|sh|bat)$ {
        deny all;
    }

    # Assets estáticos
    location ~* \.(ico|css|js|gif|jpe?g|png|svg|webp|woff|woff2|ttf|eot)$ {
        expires max;
        log_not_found off;
        try_files $uri =404;
    }

    # CodeIgniter
    location / {
        try_files $uri $uri/ /index.php;
    }

    # PHP
    location ~ \.php$ {
    try_files $uri =404;

    fastcgi_pass php-fpm:9000;
    fastcgi_index index.php;

    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTP_PROXY "";

    # A aplicação pública é HTTPS.
    # Cloudflare/Tunnel/Traefik usam HTTP apenas internamente.
    fastcgi_param HTTPS on;
    fastcgi_param HTTP_X_FORWARDED_PROTO https;
    fastcgi_param HTTP_X_FORWARDED_PORT 443;
    fastcgi_param SERVER_PORT 443;

    fastcgi_read_timeout 600;

    include fastcgi_params;
}
