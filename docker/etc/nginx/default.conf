# ==========================================================
# Redacted Access Logging for Sensitive Password Reset Tokens
# ==========================================================

map $request $tecnina_safe_request {
    default $request;
    "~*^(?<method>\S+)\s+(?<prefix>/cliente/password-reset/)[^/?#\s]+(?<suffix>\S*)\s+(?<proto>\S+)$" "$method ${prefix}[REDACTED]$suffix $proto";
}

map $request_uri $tecnina_safe_request_uri {
    default $request_uri;
    "~*^(?<prefix>/cliente/password-reset/)[^/?#\s]+(?<suffix>.*)$" "${prefix}[REDACTED]${suffix}";
}

map $http_referer $tecnina_safe_referer {
    default $http_referer;
    "~*^(?<prefix>.*(?i)/cliente/password-reset/)[^/?#\s]+(?<suffix>.*)$" "${prefix}[REDACTED]${suffix}";
}

log_format tecnina_safe '$remote_addr - $remote_user [$time_local] "$tecnina_safe_request" '
                        '$status $body_bytes_sent "$tecnina_safe_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 64M;

    # ==========================================================
    # Access Logging com Redação Segura de Tokens
    # ==========================================================

    access_log /var/log/nginx/access.log tecnina_safe;

    # ==========================================================
    # Cabeçalhos básicos de segurança
    # ==========================================================

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;


    # ==========================================================
    # Proteção de arquivos e diretórios internos
    # ==========================================================

    # Bloqueia arquivos ocultos:
    # .git, .env, .htaccess etc.
    # Exceção para .well-known.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Código interno do CodeIgniter
    location ^~ /application/ {
        deny all;
    }

    # Arquivos Docker
    location ^~ /docker/ {
        deny all;
    }

    # Documentação interna
    location ^~ /docs/ {
        deny all;
    }

    # Testes internos e ferramentas de validação
    location ^~ /tests/ {
        deny all;
        return 404;
    }

    # Diretório interno de updates
    location ^~ /updates/ {
        deny all;
    }

    # Banco SQL usado pelo instalador.
    # Precisa existir no filesystem, mas nunca pode ser baixado.
    location = /banco.sql {
        deny all;
    }

    # Arquivos internos do Composer
    location = /composer.json {
        deny all;
    }

    location = /composer.lock {
        deny all;
    }


    # ==========================================================
    # Proteção dos uploads
    # ==========================================================

    # Nunca executar PHP dentro de assets/uploads.
    location ~* ^/assets/.*\.php$ {
        deny all;
    }

    # Bloqueia download de arquivos potencialmente sensíveis.
    location ~* \.(sql|env|ini|log|ya?ml|conf|sh|bat)$ {
        deny all;
    }


    # ==========================================================
    # Arquivos estáticos
    # ==========================================================

    location ~* \.(ico|css|js|gif|jpe?g|png|svg|webp|woff|woff2|ttf|eot)$ {
        expires max;
        log_not_found off;
        try_files $uri =404;
    }


    # ==========================================================
    # CodeIgniter / MapOS
    # ==========================================================

    location / {
        try_files $uri $uri/ /index.php;
    }


    # ==========================================================
    # PHP-FPM
    # ==========================================================

    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;

        # Carrega primeiro os parâmetros padrão.
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Proteção contra variável HTTP_PROXY maliciosa.
        fastcgi_param HTTP_PROXY "";

        # ------------------------------------------------------
        # Cloudflare Tunnel -> Traefik -> nginx
        #
        # O navegador acessa HTTPS, embora internamente
        # Traefik converse com este nginx via HTTP.
        #
        # Por isso informamos explicitamente ao PHP que a
        # requisição original é HTTPS.
        # ------------------------------------------------------

        fastcgi_param HTTPS on;
        fastcgi_param REQUEST_SCHEME https;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_PORT 443;
        fastcgi_param HTTP_X_FORWARDED_SSL on;
        fastcgi_param SERVER_PORT 443;

        fastcgi_read_timeout 600;
    }
}
